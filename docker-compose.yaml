
services:

  # DATA SOURCE STORAGE LAYER
  # data-source-db: # for offline data only
  #   image: postgres:15-alpine
  #   hostname: data-source-db
  #   container_name: data-source-db
  #   ports:
  #     - "5433:5432"
  #   environment:
  #     POSTGRES_USER: ${DATA_SOURCE_DB_USER}
  #     POSTGRES_PASSWORD: ${DATA_SOURCE_DB_PASSWORD}
  #     POSTGRES_DB: ${DATA_SOURCE_DB_NAME}
  #   command:
  #     # Set wal_level to logical for CDC, which is required for Debezium to capture changes from PostgreSQL.
  #     - "postgres"
  #     - "-c"
  #     - "wal_level=logical"
  #   volumes:
  #     - data_source_data:/var/lib/postgresql/data
  #   healthcheck:
  #     # Healthcheck uses pg_isready to check if the PostgreSQL server is ready to accept connections. 
  #     # It tries to connect as the postgres user, and if it fails, it exits with code 1, indicating an unhealthy state.
  #     # You often need to read the documentation of the specific image to find out what command to use for health checks, as it can vary between images and versions.
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #     start_period: 10s
  data-source-storage:
    image: minio/minio:latest
    hostname: data-source-storage
    container_name: data-source-storage
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web UI  →  http://localhost:9001
    environment:
      MINIO_ROOT_USER: dsadmin
      MINIO_ROOT_PASSWORD: dsadmin123
    command: server /data --console-address ":9001"
    volumes:
      - data_source_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  # LAKEHOUSE STORAGE LAYER
  lakehouse-storage:
    image: minio/minio:latest
    hostname: lakehouse-storage
    container_name: lakehouse-storage
    ports:
      - "9002:9000"   # S3 API
      - "9003:9001"   # Web UI  →  http://localhost:9003
    environment:
      MINIO_ROOT_USER: lhadmin
      MINIO_ROOT_PASSWORD: lhadmin123
    command: server /data --console-address ":9001"
    volumes:
      - lakehouse_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Hive Metastore backend DB ────────────────────────────────────────────────
  metastore-db:
    image: postgres:15
    container_name: metastore-db
    ports:
      - "5432:5432"   # exposed so init_db.py can connect directly from host
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hive", "-d", "metastore"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Hive Metastore ───────────────────────────────────────────────────────────
  hive-metastore:
    image: 'starburstdata/hive:3.1.2-e.18'
    container_name: hive-metastore
    ports:
      - '9083:9083' # Access via Thrift protocol
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://metastore-db:5432/metastore
      HIVE_METASTORE_USER: hive
      HIVE_METASTORE_PASSWORD: hive
      S3_ENDPOINT: http://minio:9002
      S3_ACCESS_KEY: lhadmin
      S3_SECRET_KEY: lhadmin
      S3_PATH_STYLE_ACCESS: "true" # Required for MinIO compatibility
      # Below arguments exist for no reasons, but
      # we can not live without it
      REGION: ""
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
      AZURE_WASB_ACCESS_KEY: ""
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

